# Twin of ci.yml for docs-only PRs (the GitHub-documented pattern for
# "required checks + skipped workflows":
# https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#example-of-paths-ignore
# → "Handling skipped but required checks").
#
# ci.yml ignores docs/** and **.md; this workflow triggers on EXACTLY those
# paths and defines jobs with the SAME NAMES that pass instantly, so the
# required checks on dev/main go green instead of hanging on "expected".
#
# Two invariants:
#   1. The `paths` list here must be the mirror image of the `paths-ignore`
#      list in ci.yml. Change one → change both.
#   2. Job names here must match ci.yml's job keys exactly — required checks
#      are matched by check (job) name.
#
# A PR touching both docs and code triggers BOTH workflows; the real one wins
# on wall-clock and both pass, so that case is safe (just ~1 billed minute of
# no-op overhead per job here).
name: ci

on:
  pull_request:
    paths:
      - "docs/**"
      - "**.md"

permissions:
  contents: read

jobs:
  web:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 2
    steps:
      - run: echo "docs-only change — web checks skipped"
  design-tokens:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 2
    steps:
      - run: echo "docs-only change — design-tokens check skipped"
  backend:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 2
    steps:
      - run: echo "docs-only change — backend checks skipped"
  backend-storm:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 2
    steps:
      - run: echo "docs-only change — backend-storm check skipped"
  docker-build:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 2
    steps:
      - run: echo "docs-only change — docker-build check skipped"
  public-routes:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 2
    steps:
      - run: echo "docs-only change — public-routes check skipped"
  security:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 2
    steps:
      - run: echo "docs-only change — security checks skipped"
  lighthouse:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 2
    steps:
      - run: echo "docs-only change — lighthouse check skipped"
  e2e-auth:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 2
    steps:
      - run: echo "docs-only change — e2e-auth check skipped"
  e2e-matrix:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 2
    steps:
      - run: echo "docs-only change — e2e-matrix check skipped"
  # Kept as a REAL check, not a no-op: docs PRs still land as merge commits on
  # dev, and the title check is ~1 min. Logic mirrors ci.yml (D24 lesson:
  # fetch the CURRENT title so re-run-after-fix works).
  conventional-commits:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: check PR title + commit subjects
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          pattern='^(feat|fix|chore|docs|refactor|test|perf|ci|build|style|revert)(\([a-z0-9._/-]+\))?!?: .+'
          fail=0
          PR_TITLE="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .title)"
          if ! grep -qE "$pattern" <<<"$PR_TITLE"; then
            echo "PR title is not a conventional commit: $PR_TITLE"
            fail=1
          fi
          while IFS= read -r subject; do
            [[ "$subject" =~ ^Merge\  ]] && continue
            if ! grep -qE "$pattern" <<<"$subject"; then
              echo "commit subject is not conventional: $subject"
              fail=1
            fi
          done < <(git log --format=%s "origin/${BASE_REF}..HEAD")
          exit $fail
