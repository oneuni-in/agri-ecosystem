# SPEC D04 — merge gates. Every job here is a required check on dev/main
# (docs/runbooks/branch-protection.md). Runs on pull requests only: the
# post-merge re-run on dev was dropped to fit the private-repo Actions budget
# (2000 min/month) — the PR already tested the same tree, and staging image
# builds moved to manual dispatch (deploy-staging.yml).
#
# Docs-only PRs skip the suite via paths-ignore. A skipped required check
# would block the merge forever, so ci-docs.yml is the mandatory twin: same
# job names, triggered on the inverse paths filter, passes instantly. If you
# change the paths list below, change ci-docs.yml to match — the two lists
# must stay mirror images or docs PRs hang on "expected" checks.
# Removing or weakening a job is a visible diff in a protected workflow file.
name: ci

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "**.md"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  # A: pnpm lint + typecheck + vitest + build, turbo-cached (<10 min warm rule)
  web:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-web-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-
      # Retried once because `next/font/google` resolves Bricolage Grotesque and
      # Public Sans from fonts.gstatic.com at BUILD time, so any outbound network
      # blip on the runner fails the build regardless of what the PR changed.
      # Observed on PR #67 and #72, both of whose diffs were entirely
      # backend/core/data/seeds/**.csv.
      #
      # The retry is cheap because turbo caches successful tasks: on a second
      # attempt lint/typecheck/test are cache hits and only the failed build
      # re-runs. The cost is that a GENUINELY broken build runs twice before
      # reporting.
      #
      # This treats the symptom. The cure is vendoring the fonts via
      # next/font/local, which touches packages/ui (imported by all five apps)
      # and the preload behaviour the Lighthouse gate depends on -- deliberately
      # not bundled into this change.
      - name: lint, typecheck, test, build (retry once on transient failure)
        run: |
          set -o pipefail
          for attempt in 1 2; do
            if pnpm exec turbo run lint typecheck test build --cache-dir=.turbo; then
              exit 0
            fi
            if [ "$attempt" = 1 ]; then
              echo "::warning::web build attempt 1 failed; retrying once (turbo cache makes this cheap)"
              sleep 15
            fi
          done
          exit 1
        env:
          # sentry source-map upload: inactive until these secrets are set at
          # launch prep (docs/runbooks/monitoring.md); unset -> builds skip it
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          # Task 11 fix round 1 / Finding 2: `next build` always runs with
          # NODE_ENV=production, and ListBusinessCta now throws at build time
          # if this is unset in production (apps/web-milk/lib/console.ts) —
          # this job builds web-milk via the turbo `build` task above, so it
          # needs the var same as the lighthouse/e2e-auth/e2e-matrix jobs.
          NEXT_PUBLIC_CONSOLE_URL: http://localhost:3002

  # Non-negotiable 4: raw hex in apps/ or packages/ui fails CI (tokens only)
  design-tokens:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: node scripts/check-hex.mjs

  # A: ruff + mypy + import-linter + pytest (offset ban + migration NOTES gate
  # live in the test suite) + alembic up/down/up vs a real Postgres
  # (non-negotiable 3: irreversible migration fails CI)
  backend:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend/core
    services:
      postgres:
        # pgvector/pgvector:pg16, not plain postgres:16 — migration 0047
        # runs CREATE EXTENSION vector for the A-U4 assistant corpus.
        # Same PG major; the extension is additive. Keep every postgres
        # service in this file on this image or the job that misses it
        # fails at migrate time, not at test time.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app # CI-only credentials
          POSTGRES_DB: agri
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U app -d agri"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      meilisearch:
        image: getmeili/meilisearch:v1.13
        env:
          MEILI_ENV: development
        ports:
          - "7700:7700"
        options: >-
          --health-cmd "wget --no-verbose --spider http://127.0.0.1:7700/health"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://app_rt:app_rt@localhost:5432/agri
      DATABASE_ADMIN_URL: postgresql+asyncpg://app:app@localhost:5432/agri
      REDIS_URL: redis://localhost:6379/0
      MEILISEARCH_URL: http://localhost:7700
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/core/pyproject.toml
      - run: pip install -e .[dev]
      - run: ruff format --check .
      - run: ruff check .
      - run: mypy .
      - run: lint-imports
      - run: python scripts/migrate_check.py
      - run: pytest -q -m "not slow"

  # D13: isolates the 10k coins-storm concurrency test (~7 min) from the
  # backend job's <10-min budget; it's a separate required check so a slow
  # storm run never trips the backend job's timeout.
  backend-storm:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend/core
    services:
      postgres:
        # pgvector/pgvector:pg16, not plain postgres:16 — migration 0047
        # runs CREATE EXTENSION vector for the A-U4 assistant corpus.
        # Same PG major; the extension is additive. Keep every postgres
        # service in this file on this image or the job that misses it
        # fails at migrate time, not at test time.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app # CI-only credentials
          POSTGRES_DB: agri
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U app -d agri"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://app:app@localhost:5432/agri
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/core/pyproject.toml
      - run: pip install -e .[dev]
      - run: pytest -q -m "slow"

  # The backend job installs deps via `pip install -e .[dev]` directly and
  # never builds backend/core/Dockerfile (api + worker share it), so a broken
  # Dockerfile or a docker-compose.dev.yml drifted out of sync with
  # pyproject.toml is invisible here until someone hits it in dev or staging.
  docker-build:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: validate docker-compose.dev.yml
        run: docker compose -f docker-compose.dev.yml config --quiet
      - name: build backend image (api + worker share this Dockerfile)
        run: docker build ./backend/core -t agri-api:ci

  # B / non-negotiable 1: undeclared public route fails CI. Boots the app
  # factory and diffs the live SecureRouter registry against the committed
  # backend/core/public_routes.txt.
  public-routes:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    defaults:
      run:
        working-directory: backend/core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/core/pyproject.toml
      - run: pip install -e .
      - run: python scripts/dump_public_routes.py --check

  # A: gitleaks (full history, redacted output) + dependency audits (fail high)
  security:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.24.2"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans the whole history, not just HEAD
      - name: gitleaks secret scan
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks git --redact --no-banner --exit-code 1 .
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          # no `cache: pnpm` here: audit reads only the lockfile and never
          # populates the store, so the post-step cache save errors on the
          # missing path whenever the lockfile (cache key) changes
      - name: pnpm dependency audit (fail high)
        run: pnpm audit --audit-level high
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/core/pyproject.toml
      - name: pip-audit backend deps (fail on known vulns)
        run: |
          pip install --upgrade pip # pip itself is in the audited environment
          pip install -e backend/core pip-audit
          pip-audit --skip-editable

  # C / non-negotiable 2: Lighthouse mobile + throttled 3G on affected app
  # templates (always including the D02 /demo route); perf>=90 a11y>=95 seo>=95
  # + committed budgets.json. Thresholds live in lighthouserc.cjs.
  #
  # D28b: the job now boots the API (postgres + redis + migrate + geo + seed,
  # same stack as e2e-auth) so the /{city}/{pincode} pincode landing pages can
  # be audited too. They are milk.in's real SEO surface — home is just a
  # pincode box — and they are dynamic SSR reading covers(), so without a
  # backend they render notFound() and cannot be gated at all.
  lighthouse:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    services:
      postgres:
        # pgvector/pgvector:pg16, not plain postgres:16 — migration 0047
        # runs CREATE EXTENSION vector for the A-U4 assistant corpus.
        # Same PG major; the extension is additive. Keep every postgres
        # service in this file on this image or the job that misses it
        # fails at migrate time, not at test time.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app # CI-only credentials
          POSTGRES_DB: agri
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U app -d agri"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://app_rt:app_rt@localhost:5432/agri
      DATABASE_ADMIN_URL: postgresql+asyncpg://app:app@localhost:5432/agri
      REDIS_URL: redis://localhost:6379/0
      API_BASE_URL: http://127.0.0.1:8000
      # Task 11: web-milk's header/footer/empty-state CTA reads this at
      # build+render time; matches the console's dev/CI port (3002).
      NEXT_PUBLIC_CONSOLE_URL: http://localhost:3002
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # turbo diffs against the PR base to find affected apps
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/core/pyproject.toml
      - run: pip install -e backend/core
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-lhci-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-
      # migrate -> load_geo -> seed_e2e_milk -> uvicorn (scripts/e2e-api.mjs).
      # Backgrounded here; lhci-affected.mjs skips the landing URLs (loudly) if
      # this never comes up, so a backend failure can't silently drop coverage.
      - name: Start API for landing-page audit
        run: |
          pnpm run e2e:api &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8000/health && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8000/health
      - run: node scripts/lhci-affected.mjs
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
          TURBO_CACHE_DIR: .turbo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          # Two reasons this uploaded nothing before:
          # 1. upload-artifact@v4 skips dot-files/dirs unless told otherwise,
          #    and BOTH report dirs are hidden - so every run since the v4
          #    bump silently produced an empty artifact ("No files were found
          #    with the provided path: .lhci").
          # 2. .lhci only exists once autorun's UPLOAD stage runs, which it
          #    skips when assert fails - i.e. exactly when you want the report.
          #    collect always writes raw runs to .lighthouseci, so grab both.
          path: |
            .lhci
            .lighthouseci
          include-hidden-files: true
          if-no-files-found: warn

  # D09 non-negotiables at the browser level: signup, returning login,
  # wrong-OTP lockout UX, device revoke, logout-everywhere. Real FastAPI
  # (uvicorn + migrated Postgres + Redis) behind web-id's rewrites, driven by
  # Playwright. OTP codes come from the flag-gated mock peek route.
  e2e-auth:
    # Scoped to its NAME: `pnpm run e2e` had silently become the whole
    # desktop suite (92 tests after U1) and this job burnt its entire
    # ceiling every PR push — 35 minutes of private-repo Actions time per
    # round, twice over with the docs twin. The auth surface (auth + sso +
    # bff-path-traversal, 10 tests) is what D09/D10/D30 gate here; every
    # other spec keeps its CI coverage in e2e-matrix's device projects.
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 15
    services:
      postgres:
        # pgvector/pgvector:pg16, not plain postgres:16 — migration 0047
        # runs CREATE EXTENSION vector for the A-U4 assistant corpus.
        # Same PG major; the extension is additive. Keep every postgres
        # service in this file on this image or the job that misses it
        # fails at migrate time, not at test time.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app # CI-only credentials
          POSTGRES_DB: agri
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U app -d agri"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://app_rt:app_rt@localhost:5432/agri
      DATABASE_ADMIN_URL: postgresql+asyncpg://app:app@localhost:5432/agri
      REDIS_URL: redis://localhost:6379/0
      API_BASE_URL: http://127.0.0.1:8000
      # Task 11: web-milk's header/footer/empty-state CTA reads this at
      # build+render time; matches the console's dev/CI port (3002).
      NEXT_PUBLIC_CONSOLE_URL: http://localhost:3002
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/core/pyproject.toml
      - run: pip install -e backend/core
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium --with-deps
      # D16 claim evidence and D17 product media upload through shared.storage,
      # which is MinIO-backed. Without it _store_evidence 500s and the claim
      # journey fails with a generic "something went wrong" that says nothing
      # about the cause. Run as a step, not a service: service containers
      # cannot override the image command, and minio/minio needs `server /data`.
      # Credentials/bucket match settings.py defaults and docker-compose.dev.yml.
      - name: start MinIO (claim evidence + product media)
        run: |
          docker rm -f minio 2>/dev/null || true
          docker run -d --name minio -p 9000:9000 -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin minio/minio:latest server /data
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9000/minio/health/live >/dev/null; then break; fi
            if [ "$i" = 30 ]; then echo 'MinIO never became healthy' >&2; docker logs minio >&2; exit 1; fi
            sleep 2
          done
      - run: pnpm run e2e:auth
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results
          if-no-files-found: ignore

  # D29 device matrix: the @matrix-tagged specs on a low-end Android proxy
  # (Pixel 5 / Chromium) and iOS Safari (iPhone 13 / WebKit). Split from
  # e2e-auth rather than lengthening it so runtime stays bounded and a failure
  # names the device instead of hiding in one long serial run.
  e2e-matrix:
    # 45, raised from 35 (which was raised from 20): the suite itself is
    # ~9min locally, CI adds browser installs + migrations + the seed, and
    # the suite has grown with every UI pass (U1 took the job from ~13min to
    # ~20min). PR #60 hit the 35min cap twice with a uniform ~2.2x slowdown
    # traced to the §5b marquee animating under CI's software compositor —
    # fixed via reducedMotion in e2e/playwright.config.ts — but the ceiling
    # keeps headroom so a regression yields a COMPLETED run whose reporter
    # names the slow specs, not an opaque cancellation. A successful run
    # bills actual minutes, not the ceiling.
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 45
    services:
      postgres:
        # pgvector/pgvector:pg16, not plain postgres:16 — migration 0047
        # runs CREATE EXTENSION vector for the A-U4 assistant corpus.
        # Same PG major; the extension is additive. Keep every postgres
        # service in this file on this image or the job that misses it
        # fails at migrate time, not at test time.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app # CI-only credentials
          POSTGRES_DB: agri
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U app -d agri"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://app_rt:app_rt@localhost:5432/agri
      DATABASE_ADMIN_URL: postgresql+asyncpg://app:app@localhost:5432/agri
      REDIS_URL: redis://localhost:6379/0
      API_BASE_URL: http://127.0.0.1:8000
      # Task 11: web-milk's header/footer/empty-state CTA reads this at
      # build+render time; matches the console's dev/CI port (3002).
      NEXT_PUBLIC_CONSOLE_URL: http://localhost:3002
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/core/pyproject.toml
      - run: pip install -e backend/core
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # webkit as well as chromium - mobile-safari is the whole point of this job
      - run: pnpm exec playwright install chromium webkit --with-deps
      # D16 claim evidence and D17 product media upload through shared.storage,
      # which is MinIO-backed. Without it _store_evidence 500s and the claim
      # journey fails with a generic "something went wrong" that says nothing
      # about the cause. Run as a step, not a service: service containers
      # cannot override the image command, and minio/minio needs `server /data`.
      # Credentials/bucket match settings.py defaults and docker-compose.dev.yml.
      - name: start MinIO (claim evidence + product media)
        run: |
          docker rm -f minio 2>/dev/null || true
          docker run -d --name minio -p 9000:9000 -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin minio/minio:latest server /data
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9000/minio/health/live >/dev/null; then break; fi
            if [ "$i" = 30 ]; then echo 'MinIO never became healthy' >&2; docker logs minio >&2; exit 1; fi
            sleep 2
          done
      - run: pnpm run e2e:matrix
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces-matrix
          path: test-results
          if-no-files-found: ignore

  # G: conventional commits enforced on the PR title and every branch commit
  conventional-commits:
    if: github.event_name == 'pull_request'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: check PR title + commit subjects
        env:
          # The event payload freezes the title at trigger time, so a re-run
          # after fixing the title would replay the stale value and fail
          # forever (D24 lesson). Fetch the CURRENT title instead — then
          # "Re-run failed jobs" alone picks up the fix (no close/reopen,
          # no full-suite re-trigger).
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          pattern='^(feat|fix|chore|docs|refactor|test|perf|ci|build|style|revert)(\([a-z0-9._/-]+\))?!?: .+'
          fail=0
          PR_TITLE="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .title)"
          if ! grep -qE "$pattern" <<<"$PR_TITLE"; then
            echo "PR title is not a conventional commit: $PR_TITLE"
            fail=1
          fi
          while IFS= read -r subject; do
            [[ "$subject" =~ ^Merge\  ]] && continue
            if ! grep -qE "$pattern" <<<"$subject"; then
              echo "commit subject is not conventional: $subject"
              fail=1
            fi
          done < <(git log --format=%s "origin/${BASE_REF}..HEAD")
          exit $fail
