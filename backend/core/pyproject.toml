[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agri-core"
version = "0.1.0"
description = "Agri ecosystem core API - FastAPI modular monolith"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "uuid6>=2024.1.12",
    "redis>=5.0",
    "httpx>=0.27",
    "prometheus-client>=0.20",
    "sentry-sdk[fastapi]>=2.0",
    "authlib>=1.6",
    "joserfc>=1.0",
    "pillow>=11",
    "python-multipart>=0.0.9",
    "minio>=7.2",
    "maxminddb>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.10",
    "ruff>=0.5",
    "import-linter>=2.0",
]

[tool.setuptools]
py-modules = ["main", "settings"]

[tool.setuptools.packages.find]
include = ["modules*", "shared*"]

[tool.setuptools.package-data]
"modules.identity" = ["*.txt"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "T20"]

[tool.ruff.lint.isort]
known-first-party = ["modules", "shared", "settings", "main"]

[tool.ruff.lint.per-file-ignores]
# D26 suites import the shared `api` fixture from tests/d26_helpers.py by
# name (pytest fixture-injection idiom - the import makes it visible to
# pytest's collector, then every test function re-binds `api` as its own
# parameter to receive the fixture value). Pyflakes has no concept of pytest
# fixture injection, so it sees the parameter as redefining a "still unused"
# import and flags F811 at every test signature - not a real bug. Any new
# file importing `api` from tests.d26_helpers needs to be added here too.
"tests/test_business_analytics.py" = ["F811"]
"tests/test_delivery_windows.py" = ["F811"]
"tests/test_directory_admin_tier.py" = ["F811"]
"tests/test_inbox_type_filter.py" = ["F811"]
"tests/test_profile_views.py" = ["F811"]
"tests/test_tier_selection.py" = ["F811"]
"tests/test_vertical_schema_route.py" = ["F811"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "."

[[tool.mypy.overrides]]
# authlib ships no type stubs; joserfc is typed, authlib's OAuth2 core is not
module = ["authlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "slow: long-running tests (e.g. the 10k coins storm); excluded from the default CI run",
]

[tool.importlinter]
root_packages = ["modules", "shared"]

[[tool.importlinter.contracts]]
name = "Modules must not import each other"
type = "independence"
modules = [
    "modules.identity",
    "modules.coins",
    "modules.directory",
    "modules.leads",
    "modules.content",
    "modules.market_data",
    "modules.ads",
    "modules.notify",
    "modules.search",
    "modules.billing",
    "modules.ai",
    "modules.ops",
]

[[tool.importlinter.contracts]]
name = "Shared must not import modules"
type = "forbidden"
source_modules = ["shared"]
forbidden_modules = ["modules"]

[[tool.importlinter.contracts]]
name = "Notify drivers only reachable from inside notify (D12 lint contract)"
type = "forbidden"
source_modules = [
    "modules.identity",
    "modules.coins",
    "modules.directory",
    "modules.leads",
    "modules.content",
    "modules.market_data",
    "modules.ads",
    "modules.search",
    "modules.billing",
    "modules.ai",
    "modules.ops",
    "shared",
]
forbidden_modules = ["modules.notify.drivers"]
