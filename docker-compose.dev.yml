name: agri-dev

services:
  api:
    build: ./backend/core
    ports:
      - "8000:8000"
    environment:
      APP_ENV: dev
      DATABASE_URL: postgresql+asyncpg://app_rt:app_rt@postgres:5432/agri
      DATABASE_ADMIN_URL: postgresql+asyncpg://app:app@postgres:5432/agri
      REDIS_URL: redis://redis:6379/0
      MEILISEARCH_URL: http://meilisearch:7700
      MINIO_ENDPOINT: http://minio:9000
    volumes:
      - ./backend/core:/app
    working_dir: /app
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status == 200 else 1)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  worker:
    build: ./backend/core
    environment:
      APP_ENV: dev
      DATABASE_URL: postgresql+asyncpg://app_rt:app_rt@postgres:5432/agri
      REDIS_URL: redis://redis:6379/0
      MEILISEARCH_URL: http://meilisearch:7700
      MINIO_ENDPOINT: http://minio:9000
    volumes:
      - ./backend/core:/app
    working_dir: /app
    command: ["python", "-m", "modules.coins.worker"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # A-U2: the thing that actually captures the day's mandi prices.
  # Wired here as well as in staging because the Agmarknet resource serves
  # ONLY the live day — a day nobody pulls is a permanent hole in the
  # series, and "staging will run it eventually" quietly loses one every
  # 24h until staging exists. The scheduler no-ops without
  # DATA_GOV_API_KEY, so this is inert on a machine that has not set one.
  mandi-cron:
    build: ./backend/core
    environment:
      APP_ENV: dev
      DATABASE_URL: postgresql+asyncpg://app_rt:app_rt@postgres:5432/agri
      REDIS_URL: redis://redis:6379/0
      # Without this the scheduler's stdout sits in Python's buffer and
      # `docker logs` shows nothing until the process exits — on a job that
      # sleeps for hours between pulls, that reads exactly like a hung
      # container. This job's failure mode is a silently un-pulled day, so
      # being able to see it start and fire is the point.
      PYTHONUNBUFFERED: "1"
      # DATA_GOV_API_KEY is deliberately NOT listed here. The source tree
      # is bind-mounted at /app, so pydantic-settings reads the key from
      # /app/.env (gitignored) exactly as it does on the host. Passing
      # ${DATA_GOV_API_KEY:-} instead would set an EMPTY env var whenever
      # the host shell lacks it, and env vars outrank .env — so the
      # "convenience" would silently shadow the real key.
    volumes:
      - ./backend/core:/app
    working_dir: /app
    command: ["python", "-m", "scripts.mandi_scheduler"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  search-worker:
    build: ./backend/core
    environment:
      APP_ENV: dev
      DATABASE_URL: postgresql+asyncpg://app_rt:app_rt@postgres:5432/agri
      REDIS_URL: redis://redis:6379/0
      MEILISEARCH_URL: http://meilisearch:7700
      MINIO_ENDPOINT: http://minio:9000
    volumes:
      - ./backend/core:/app
    working_dir: /app
    command: ["python", "-m", "modules.search.worker"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy

  postgres:
    image: postgres:16
    # D05 observability: pg_stat_statements needs a preload; statements
    # slower than 200ms land in the container log (docker logs).
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - log_min_duration_statement=200ms
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app # dev-only credentials
      POSTGRES_DB: agri
    ports:
      # 55432 on the host: Windows dev boxes often run a native PostgreSQL
      # service on 5432, which silently wins localhost connections.
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d agri"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:v1.13
    environment:
      MEILI_ENV: development
    ports:
      - "7700:7700"
    volumes:
      - meilidata:/meili_data
    healthcheck:
      # 127.0.0.1, not localhost: busybox wget resolves localhost to ::1 but
      # meilisearch binds IPv4 only
      test: ["CMD-SHELL", "wget --no-verbose --spider http://127.0.0.1:7700/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin # dev-only credentials
      MINIO_ROOT_PASSWORD: minioadmin # dev-only credentials
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  redisdata:
  meilidata:
  miniodata:
