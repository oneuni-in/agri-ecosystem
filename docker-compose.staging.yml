# Staging stack (SPEC D04-E): same VPS as everything else, ISOLATED compose
# project. Always run with `-p agri-staging -f docker-compose.staging.yml`.
# Images come from GHCR tagged by git sha (TAG env, set by the deploy script);
# secrets come from secrets/staging.env, decrypted from SOPS at deploy time
# and removed afterwards. No bind mounts, no build: — staging runs only what
# CI built and pushed.
name: agri-staging

services:
  api:
    image: ghcr.io/oneuni-in/agri-api:${TAG:-dev}
    env_file: secrets/staging.env
    ports:
      - "8100:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status == 200 else 1)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # D22 A3-2: the coins-award and search-index workers are standalone
  # `python -m` processes (the notify worker runs in-process in the api
  # lifespan, these two do not). docker-compose.dev.yml starts both; staging
  # MUST too, or business/product/claim/review events accumulate unconsumed —
  # zero coins awarded and a permanently stale Meilisearch index — while the
  # api itself looks healthy. Same api image, app_rt DATABASE_URL from
  # secrets/staging.env, different command.
  worker:
    image: ghcr.io/oneuni-in/agri-api:${TAG:-dev}
    env_file: secrets/staging.env
    command: ["python", "-m", "modules.coins.worker"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  search-worker:
    image: ghcr.io/oneuni-in/agri-api:${TAG:-dev}
    env_file: secrets/staging.env
    command: ["python", "-m", "modules.search.worker"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    restart: unless-stopped

  # The daily Agmarknet pull. Not a convenience job: the source serves only
  # the live day, so a day this container does not run is permanently absent
  # from the price series and no later job can recover it (ADR-0012).
  # Also wired in docker-compose.dev.yml since PR #89 — "staging will run it
  # eventually" was quietly losing a day every 24h until staging exists.
  mandi-cron:
    image: ghcr.io/oneuni-in/agri-api:${TAG:-dev}
    env_file: secrets/staging.env
    command: ["python", "-m", "scripts.mandi_scheduler"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # A-U4b O3: the daily curated-RSS pull for the content engine.
  # scripts/content_pull.py existed and nothing ran it — the same failure
  # class as AG-A25. RSS keeps back-items so a missed day is usually
  # recoverable, but a feed nobody pulls is a dead section. No API key
  # needed: the sources are public feeds read politely once a day.
  content-cron:
    image: ghcr.io/oneuni-in/agri-api:${TAG:-dev}
    env_file: secrets/staging.env
    command: ["python", "-m", "scripts.content_scheduler"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web-milk:
    image: ghcr.io/oneuni-in/agri-web-milk:${TAG:-dev}
    # Task 11: the "List your dairy business" CTA reads NEXT_PUBLIC_CONSOLE_URL
    # at build time (NEXT_PUBLIC_ vars are inlined into the JS bundle in
    # apps/Dockerfile's builder stage — same as NEXT_PUBLIC_RELEASE/GIT_SHA).
    # deploy-staging.yml's build-push job sources it from the repo variable
    # `NEXT_PUBLIC_CONSOLE_URL` (Settings → Variables) and passes it as the
    # `CONSOLE_URL` --build-arg — see docs/runbooks/staging-deploy.md's
    # "Repository variables" section for the required setup. If that repo
    # variable is unset, the web-milk image build fails on purpose
    # (apps/web-milk/lib/console.ts throws at build time) rather than
    # silently shipping a dead cross-origin link — set the variable, don't
    # lower this gate. An `environment:` entry on this service would NOT
    # substitute for it: the var is inlined at build time, not read at
    # container-start time, so building this image locally (`docker build
    # -f apps/Dockerfile --build-arg APP=web-milk --build-arg
    # CONSOLE_URL=<console-origin> .`) needs the same --build-arg too.
    # env_file on every web service, matching what the example file has
    # always claimed ("the SINGLE env file every staging service reads") and
    # what the api/workers already do. Without it the Next.js containers ran
    # with NO environment at all, so AUTH_SESSION_SECRET could never reach
    # them - auth-client then throws at boot in production, and the runbook's
    # owner-action #1 had no wiring to land on. Trade-off stated rather than
    # hidden: the web containers now see the whole shared file, including
    # infra credentials, exactly as the api container already does; a
    # least-privilege split into web.env/api.env is a follow-up decision,
    # not a blocker.
    env_file: secrets/staging.env
    ports:
      - "3100:3000"
    healthcheck: &web-health
      test: ["CMD-SHELL", "wget --no-verbose --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  web-organic:
    image: ghcr.io/oneuni-in/agri-web-organic:${TAG:-dev}
    env_file: secrets/staging.env
    ports:
      - "3101:3000"
    healthcheck: *web-health
    restart: unless-stopped

  web-agri:
    image: ghcr.io/oneuni-in/agri-web-agri:${TAG:-dev}
    env_file: secrets/staging.env
    ports:
      - "3102:3000"
    healthcheck: *web-health
    restart: unless-stopped

  web-id:
    image: ghcr.io/oneuni-in/agri-web-id:${TAG:-dev}
    env_file: secrets/staging.env
    ports:
      - "3103:3000"
    healthcheck: *web-health
    restart: unless-stopped

  web-admin:
    image: ghcr.io/oneuni-in/agri-web-admin:${TAG:-dev}
    env_file: secrets/staging.env
    ports:
      - "3104:3000"
    healthcheck: *web-health
    restart: unless-stopped

  postgres:
    # pgvector/pgvector:pg16 — migration 0047 runs CREATE EXTENSION
    # vector. Same PG major, additive extension, existing volume fine.
    # NOTE for whoever first applies this to a volume that already has
    # data: the pgvector image ships a different glibc, so Postgres
    # warns about a collation-version mismatch — run REINDEX DATABASE
    # then ALTER DATABASE ... REFRESH COLLATION VERSION once, on every
    # database including template1, or CREATE DATABASE starts failing.
    image: pgvector/pgvector:pg16
    # D05 observability: mirror of docker-compose.dev.yml postgres command
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - log_min_duration_statement=200ms
    env_file: secrets/staging.env # POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  meilisearch:
    image: getmeili/meilisearch:v1.13
    env_file: secrets/staging.env # MEILI_MASTER_KEY
    environment:
      MEILI_ENV: production
    volumes:
      - meilidata:/meili_data
    healthcheck:
      # 127.0.0.1, not localhost: busybox wget resolves localhost to ::1 but
      # meilisearch binds IPv4 only
      test: ["CMD-SHELL", "wget --no-verbose --spider http://127.0.0.1:7700/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    env_file: secrets/staging.env # MINIO_ROOT_USER / MINIO_ROOT_PASSWORD
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  meilidata:
  miniodata:
