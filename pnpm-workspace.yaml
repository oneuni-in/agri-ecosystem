packages:
  - "apps/*"
  - "packages/*"

# sharp is next/image's optimizer; it needs its install script to fetch the
# native binary. Every other build script stays blocked by default.
allowBuilds:
  # next-intl transitives; they ship prebuilt binaries, postinstall not needed.
  "@parcel/watcher": false
  "@swc/core": false
  sharp: true
  # sentry-cli downloads its binary in postinstall; only needed once source-map
  # upload activates at launch prep (docs/runbooks/monitoring.md). Keep blocked.
  "@sentry/cli": false

# security-audit floors (pnpm audit --audit-level high is a CI gate);
# tmp <0.2.6 (GHSA-ph9p-34f9-6g65) comes in through @lhci/cli
# brace-expansion 1.x/2.x (GHSA-3jxr-9vmj-r5cp) via minimatch everywhere;
# js-yaml 4.x <4.3.0 (GHSA-52cp-r559-cp3m) via @redocly/openapi-core;
# postcss/body-parser are patch-level floors for the moderate/low findings.
# uuid <11.1.1 (moderate, GHSA in v3/v5/v6 buf path) is NOT floored: the fix
# is a major jump for transitive users and the gate only fails on high.
overrides:
  tmp: ">=0.2.6"
  # fast-uri <=3.1.3 (GHSA-v2hh-gcrm-f6hx, host confusion via backslash
  # authority) via ajv/schema-utils chains everywhere webpack appears;
  # sharp <0.35.0 (GHSA-f88m-g3jw-g9cj, inherited libvips CVEs) via next's
  # image optimizer - 0.35 is the patched line, sharp keeps its allowBuilds
  # entry above so the native binary refetches on install.
  fast-uri: ">=3.1.4 <4"
  sharp: ">=0.35.0 <0.36"
  # replacement ranges stay within-major: an open ">=" floor lets pnpm pick
  # the newest major (minimatch@3 + brace-expansion@4 = "expand is not a
  # function" at eslint startup)
  "brace-expansion@1": ">=1.1.16 <2"
  "brace-expansion@2": ">=2.1.2 <3"
  "js-yaml@4": ">=4.3.0 <5"
  postcss: ">=8.5.10 <9"
  body-parser: ">=1.20.6 <2"
