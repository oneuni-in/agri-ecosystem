packages:
  - "apps/*"
  - "packages/*"

# sharp is next/image's optimizer; it needs its install script to fetch the
# native binary. Every other build script stays blocked by default.
allowBuilds:
  # next-intl transitives; they ship prebuilt binaries, postinstall not needed.
  "@parcel/watcher": false
  "@swc/core": false
  sharp: true
  # sentry-cli downloads its binary in postinstall; only needed once source-map
  # upload activates at launch prep (docs/runbooks/monitoring.md). Keep blocked.
  "@sentry/cli": false

# postcss 8.5.18 is the patched release for GHSA-r28c-9q8g-f849 (high);
# excluded from the release-age delay so the floor below is installable.
minimumReleaseAgeExclude:
  - postcss@8.5.18

# security-audit floors (pnpm audit --audit-level high is a CI gate);
# tmp <0.2.6 (GHSA-ph9p-34f9-6g65) comes in through @lhci/cli
# brace-expansion 1.x/2.x (GHSA-3jxr-9vmj-r5cp) via minimatch everywhere;
# js-yaml 4.x <4.3.0 (GHSA-52cp-r559-cp3m) via @redocly/openapi-core;
# postcss/body-parser are patch-level floors for the moderate/low findings.
# uuid <11.1.1 (moderate, GHSA in v3/v5/v6 buf path) is NOT floored: the fix
# is a major jump for transitive users and the gate only fails on high.
overrides:
  tmp: ">=0.2.6"
  # fast-uri <=3.1.3 (GHSA-v2hh-gcrm-f6hx, host confusion via backslash
  # authority) via ajv/schema-utils chains everywhere webpack appears;
  # sharp <0.35.0 (GHSA-f88m-g3jw-g9cj, inherited libvips CVEs) via next's
  # image optimizer - 0.35 is the patched line, sharp keeps its allowBuilds
  # entry above so the native binary refetches on install.
  fast-uri: ">=3.1.5 <4"
  sharp: ">=0.35.0 <0.36"
  # ip-address <=10.3.0 (high, Address4 leading-zero octet confusion) via
  # pac-resolver/proxy-agent under @lhci/cli - dev tooling only, patch is
  # within-major.
  ip-address: ">=10.3.1 <11"
  # replacement ranges stay within-major: an open ">=" floor lets pnpm pick
  # the newest major (minimatch@3 + brace-expansion@4 = "expand is not a
  # function" at eslint startup). 2026-08 advisory finally shipped per-major
  # brace-expansion backports (1.1.18 / 2.1.4 / 5.0.9) - floors raised to
  # them.
  "brace-expansion@1": ">=1.1.18 <2"
  "brace-expansion@2": ">=2.1.4 <3"
  "brace-expansion@5": ">=5.0.9 <6"
  # 4.3.1 also covers GHSA-5p4m-2wfm-xmqj (high, quadratic !!omap CPU); the
  # same advisory hits the 3.x line eslint's @eslint/eslintrc still carries,
  # so 3.x gets its own within-major floor (3.15.1 is its backport).
  "js-yaml@4": ">=4.3.1 <5"
  "js-yaml@3": ">=3.15.1 <4"
  # nanoid <3.3.17 (GHSA-2v37-7h3g-55p8, high: zero-size custom generators
  # loop forever) via postcss everywhere webpack/next appear. 4.x/5.x lines
  # are not affected, so the floor stays within major 3.
  "nanoid@3": ">=3.3.17 <4"
  # 8.5.18 patches GHSA-r28c-9q8g-f849 (high, sourceMappingURL path traversal).
  postcss: ">=8.5.18 <9"
  body-parser: ">=1.20.6 <2"

# Audit advisories with no fix we can pull yet. Unlike the overrides above
# (which raise to a released patch), these are ignored WITH A REASON because
# the patched version does not exist on npm, and the code path is dev-only
# tooling that never reaches an app runtime bundle or a user. Re-check on a
# lockfile bump: drop the entry the moment a patched version ships.
auditConfig:
  ignoreGhsas:
    # extract-zip <=2.0.1 (GHSA-jmr9-qjv8-65gv, high: unvalidated symlink path
    # traversal on unzip) via puppeteer-core > @puppeteer/browsers under
    # @lhci/cli - Lighthouse CI's headless-Chrome download, dev tooling only,
    # never bundled into any app. The advisory lists a 2.0.2 patch but npm's
    # latest published extract-zip is still 2.0.1 (no release to floor to);
    # the fix rides a @puppeteer/browsers bump. Drop when 2.0.2 ships.
    - GHSA-jmr9-qjv8-65gv

